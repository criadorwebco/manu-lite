
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: ["gateway", "run"]

    environment:
      HERMES_HOME: /opt/data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:?}

    volumes:
      - manu-hermes:/opt/data

  escritorio-ia:
    build:
      context: ./escritorio-ia
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      - hermes

    ports:
      - "127.0.0.1:4747:4747"

    environment:
      NODE_ENV: production
      HABBLAUD_HOST: 0.0.0.0
      HABBLAUD_PORT: "4747"
      HABBLAUD_IN_DOCKER: "1"
      HABBLAUD_LANG: pt-BR
      HABBLAUD_DATA_DIR: /data

      # Acesso restrito ao computador via túnel SSH
      HABBLAUD_BIND: 127.0.0.1
      HABBLAUD_ACCESS_TOKEN: ${MANU_ACCESS_TOKEN:?}

      # Banco do Hermes em modo somente leitura
      HERMES_STATE_DB: /hermes-data/state.db
      HERMES_OWNER_NAME: Chefe

    volumes:
      - manu-hermes:/hermes-data:ro
      - manu-office:/data

volumes:
  manu-hermes:
  manu-office:
